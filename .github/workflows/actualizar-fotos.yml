name: Actualizar galería de fotos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar herramientas de imágenes
        run: |
          python3 -m pip install Pillow

      - name: Generar lista y miniaturas
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageOps, UnidentifiedImageError

          carpeta = Path("fotos")
          miniaturas = carpeta / "miniaturas"
          miniaturas.mkdir(exist_ok=True)

          extensiones = {".jpg", ".jpeg", ".png", ".webp"}
          fotografias = []

          for archivo in sorted(carpeta.iterdir()):
              if not archivo.is_file():
                  continue
              if archivo.suffix.lower() not in extensiones:
                  continue

              destino = miniaturas / (archivo.name + ".jpg")

              try:
                  with Image.open(archivo) as original:
                      imagen = ImageOps.exif_transpose(original)
                      imagen.thumbnail((400, 400))

                      if imagen.mode == "RGBA":
                          fondo = Image.new("RGB", imagen.size, (0, 0, 0))
                          fondo.paste(imagen, mask=imagen.getchannel("A"))
                          imagen = fondo
                      else:
                          imagen = imagen.convert("RGB")

                      imagen.save(destino, "JPEG", quality=78, optimize=True)

                  fotografias.append({
                      "original": archivo.name,
                      "miniatura": "miniaturas/" + destino.name
                  })

              except (UnidentifiedImageError, OSError) as error:
                  print(f"No se pudo procesar {archivo.name}: {error}")

          (carpeta / "fotos.json").write_text(
              json.dumps(fotografias, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print(f"Fotografías procesadas: {len(fotografias)}")
          PY

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos del sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  publicar:
    needs: preparar
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
