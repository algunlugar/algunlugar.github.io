
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Algún Lugar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000000;
      font-family: Georgia, serif;
    }

    .portada {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .contenedor {
      position: relative;
      width: fit-content;
      max-width: 100vw;
      max-height: 100dvh;
    }

    .contenedor img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100vw;
      max-height: 100dvh;
    }

    nav {
      position: absolute;
      right: 3%;
      top: 61%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 42px;
    }

    nav a,
    .firma a {
      color: #111111;
      text-decoration: none;
      font-size: 19px;
      font-weight: normal;
      white-space: nowrap;
    }

    nav a:hover,
    nav a:focus-visible,
    .firma a:hover,
    .firma a:focus-visible {
      text-decoration: underline;
    }

    .firma {
      position: absolute;
      right: 3%;
      bottom: 3%;
    }

    @media (max-width: 600px) {
      nav {
        right: 3%;
        gap: 18px;
      }

      nav a,
      .firma a {
        font-size: clamp(9px, 2.4vw, 15px);
      }
    }
  </style>
</head>

<body>
  <main class="portada">
    <div class="contenedor">

      <img src="portada.jpg"
           alt="Escalera bajo una cúpula">

      <nav aria-label="Secciones">
        <a href="literatura/">
          textos/fragmentos
        </a>

        <a href="fotografia/">
          fotos/instantes
        </a>

        <a href="musica/">
          ruidos/ecos
        </a>

        <a href="autor/">
          alguien/nadie
        </a>
      </nav>

      <div class="firma">
        <a href="#" onclick="return false;">
          deja tu firma
        </a>
      </div>

    </div>
  </main>
</body>
</html>
