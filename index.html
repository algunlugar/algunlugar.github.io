
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Algún Lugar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000000;
      font-family: Georgia, serif;
    }

    .portada {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .contenedor {
      position: relative;
      width: fit-content;
      max-width: 100vw;
      max-height: 100dvh;
    }

    .contenedor img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100vw;
      max-height: 100dvh;
    }

    nav {
      position: absolute;
      right: 3%;
      top: 70%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 22px;
    }

    nav a {
      color: #222;
      text-decoration: none;
      font-size: 17px;
      line-height: 1.3;
    }

    nav a:hover,
    nav a:focus-visible {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      nav {
        right: 3%;
        gap: 14px;
      }

      nav a {
        font-size: clamp(10px, 2.5vw, 15px);
      }
    }
  </style>
</head>

<body>
  <main class="portada">
    <div class="contenedor">

      <img src="portada.jpg"
           alt="Escalera bajo una cúpula">

      <nav aria-label="Secciones">
        <a href="literatura/">literatura</a>
        <a href="musica/">música</a>
        <a href="fotografia/">fotografía</a>
        <a href="autor/">autor</a>
      </nav>

    </div>
  </main>
</body>
</html>
