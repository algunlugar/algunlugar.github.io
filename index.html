
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Algún Lugar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000000;
      font-family: Georgia, serif;
    }

    .portada {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .contenedor {
      position: relative;
      width: fit-content;
      max-width: 100vw;
      max-height: 100dvh;
    }

    .contenedor img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100vw;
      max-height: 100dvh;
    }

    /* Cita literaria */

    .cita {
      position: absolute;
      top: 7%;
      right: 3%;
      text-align: right;
      color: #111111;
    }

    .cita blockquote {
      margin: 0;
      font-size: 15px;
      font-weight: normal;
      line-height: 1.6;
    }

    .cita .autor {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.5;
    }

    /* Enlaces principales */

    nav {
      position: absolute;
      right: 3%;
      top: 66%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 42px;
    }

    nav a,
    .firma a {
      color: #111111;
      text-decoration: none;
      font-size: 13px;
      font-weight: normal;
      white-space: nowrap;
    }

    nav a:hover,
    nav a:focus-visible,
    .firma a:hover,
    .firma a:focus-visible {
      text-decoration: underline;
    }

    /* Libro de visitas */

    .firma {
      position: absolute;
      right: 3%;
      bottom: 3%;
    }

    /* Adaptación a celulares */

    @media (max-width: 600px) {
      .cita {
        top: 5%;
        right: 3%;
      }

      .cita blockquote {
        font-size: clamp(9px, 2.4vw, 15px);
        line-height: 1.5;
      }

      .cita .autor {
        font-size: clamp(8px, 2vw, 13px);
        margin-top: 7px;
      }

      nav {
        right: 3%;
        top: 66%;
        gap: 18px;
      }

      nav a,
      .firma a {
        font-size: clamp(9px, 2.4vw, 13px);
      }
    }
  </style>
</head>

<body>
  <main class="portada">
    <div class="contenedor">

      <img src="portada.jpg"
           alt="Escalera bajo una cúpula">

      <section class="cita" aria-label="Cita literaria">

        <blockquote>
          “Todo necesita justificar su existencia,<br>
          salvo la obra de arte”.
        </blockquote>

        <div class="autor">
          Nicolás Gómez Dávila,
          <i>Escolios a un texto implícito</i>
        </div>

      </section>

      <nav aria-label="Secciones">

        <a href="textos/">
          textos/fragmentos
        </a>

        <a href="fotos/">
          fotos/instantes
        </a>

        <a href="https://emmeleia.bandcamp.com/"
           target="_blank"
           rel="noopener noreferrer">
          ecos/silencios
        </a>

        <a href="alguien/">
          alguien/nadie
        </a>

      </nav>

      <div class="firma">
        <a href="visitas/">
          firma el libro de visitas
        </a>
      </div>

    </div>
  </main>
</body>
</html>
