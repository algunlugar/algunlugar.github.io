
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fotos/instantes</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000000;
      font-family: Georgia, serif;
    }

    .galeria {
      padding: 30px;
      column-count: 4;
      column-gap: 12px;
    }

    .galeria img {
      display: block;
      width: 100%;
      height: auto;
      margin-bottom: 12px;
      break-inside: avoid;
      cursor: pointer;
    }

    .galeria img:hover {
      opacity: 0.85;
    }

    /* Visor de fotografías */

    .visor {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.96);
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .visor.activo {
      display: flex;
    }

    .visor img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
    }

    .cerrar,
    .anterior,
    .siguiente {
      position: absolute;
      color: white;
      background: none;
      border: none;
      cursor: pointer;
      font-family: Georgia, serif;
      font-size: 28px;
    }

    .cerrar {
      top: 20px;
      right: 25px;
    }

    .anterior {
      left: 20px;
    }

    .siguiente {
      right: 20px;
    }

    /* Adaptación a pantallas pequeñas */

    @media (max-width: 900px) {
      .galeria {
        column-count: 3;
      }
    }

    @media (max-width: 600px) {
      .galeria {
        column-count: 2;
        padding: 12px;
      }

      .visor img {
        max-width: 85vw;
      }
    }
  </style>
</head>

<body>

  <main class="galeria">

    <img src="20150928_181843.jpg" alt="Fotografía 1">
    <img src="20151113_175118.jpg" alt="Fotografía 2">
    <img src="20151126_180045.jpg" alt="Fotografía 3">
    <img src="20151231_182945.jpg" alt="Fotografía 4">
    <img src="20160207_172219.jpg" alt="Fotografía 5">
    <img src="20160207_172746bn.jpg" alt="Fotografía 6">
    <img src="20160207_174030.jpg" alt="Fotografía 7">

  </main>

  <div class="visor" id="visor"
       role="dialog" aria-modal="true"
       aria-label="Visor de fotografías">

    <button class="cerrar" aria-label="Cerrar">×</button>
    <button class="anterior" aria-label="Anterior">‹</button>

    <img id="imagenAmpliada"
         src="" alt="Fotografía ampliada">

    <button class="siguiente" aria-label="Siguiente">›</button>

  </div>

  <script>
    const imagenes = Array.from(
      document.querySelectorAll(".galeria img")
    );

    const visor = document.getElementById("visor");
    const ampliada = document.getElementById("imagenAmpliada");

    let indice = 0;

    function mostrarImagen(n) {
      indice = (n + imagenes.length) % imagenes.length;
      ampliada.src = imagenes[indice].src;
      ampliada.alt = imagenes[indice].alt;
    }

    imagenes.forEach((imagen, i) => {
      imagen.addEventListener("click", () => {
        mostrarImagen(i);
        visor.classList.add("activo");
      });
    });

    function cerrarVisor() {
      visor.classList.remove("activo");
    }

    document.querySelector(".cerrar")
      .addEventListener("click", cerrarVisor);

    document.querySelector(".anterior")
      .addEventListener("click", () => {
        mostrarImagen(indice - 1);
      });

    document.querySelector(".siguiente")
      .addEventListener("click", () => {
        mostrarImagen(indice + 1);
      });

    visor.addEventListener("click", (evento) => {
      if (evento.target === visor) {
        cerrarVisor();
      }
    });

    document.addEventListener("keydown", (evento) => {
      if (!visor.classList.contains("activo")) return;

      if (evento.key === "Escape") {
        cerrarVisor();
      }

      if (evento.key === "ArrowLeft") {
        mostrarImagen(indice - 1);
      }

      if (evento.key === "ArrowRight") {
        mostrarImagen(indice + 1);
      }
    });
  </script>

</body>
</html>
