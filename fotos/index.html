
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fotos/instantes</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #000000;
      font-family: Georgia, serif;
    }

    /* Enlace a la portada */

    .regreso {
      display: inline-block;
      margin: 24px 30px 8px;
      color: #cccccc;
      text-decoration: none;
      font-size: 14px;
    }

    .regreso:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    /* Galería */

    .galeria {
      padding: 20px 30px 40px;
      column-count: 6;
      column-gap: 12px;
    }

    .galeria img {
      display: block;
      width: 100%;
      height: auto;
      margin-bottom: 12px;
      break-inside: avoid;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .galeria img:hover {
      opacity: 0.8;
    }

    /* Visor ampliado */

    .visor {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.97);
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .visor.activo {
      display: flex;
    }

    .visor img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
    }

    .cerrar,
    .anterior,
    .siguiente {
      position: absolute;
      color: #ffffff;
      background: none;
      border: none;
      cursor: pointer;
      font-family: Georgia, serif;
      font-size: 28px;
    }

    .cerrar {
      top: 20px;
      right: 25px;
    }

    .anterior {
      left: 20px;
    }

    .siguiente {
      right: 20px;
    }

    /* Pantallas medianas */

    @media (max-width: 1100px) {
      .galeria {
        column-count: 4;
      }
    }

    /* Celulares */

    @media (max-width: 600px) {
      .galeria {
        column-count: 2;
        padding: 12px;
        column-gap: 10px;
      }

      .galeria img {
        margin-bottom: 10px;
      }

      .regreso {
        margin: 18px 12px 8px;
        font-size: 13px;
      }

      .visor img {
        max-width: 85vw;
        max-height: 85vh;
      }
    }
  </style>
</head>

<body>

  <a class="regreso" href="../">
    página principal
  </a>

  <main class="galeria" id="galeria"
        aria-label="Galería de fotografías">
  </main>

  <div class="visor" id="visor"
       role="dialog"
       aria-modal="true"
       aria-label="Visor de fotografías">

    <button class="cerrar" aria-label="Cerrar">×</button>
    <button class="anterior" aria-label="Anterior">‹</button>

    <img id="imagenAmpliada"
         src="" alt="Fotografía ampliada">

    <button class="siguiente" aria-label="Siguiente">›</button>

  </div>

  <script>
    const galeria = document.getElementById("galeria");
    const visor = document.getElementById("visor");
    const ampliada = document.getElementById("imagenAmpliada");

    let imagenes = [];
    let indice = 0;

    /* Cargar automáticamente la lista de fotografías */

    async function cargarFotografias() {
      try {
        const respuesta = await fetch(
          "fotos.json",
          { cache: "no-store" }
        );

        if (!respuesta.ok) {
          throw new Error("No se pudo cargar fotos.json");
        }

        const archivos = await respuesta.json();

        archivos.forEach((archivo, i) => {
          const imagen = document.createElement("img");

          imagen.src = encodeURIComponent(archivo);
          imagen.alt = "Fotografía " + (i + 1);
          imagen.loading = "lazy";

          imagen.addEventListener("click", () => {
            mostrarImagen(i);
            visor.classList.add("activo");
          });

          galeria.appendChild(imagen);
          imagenes.push(imagen);
        });

      } catch (error) {
        console.error("Error al cargar la galería:", error);
      }
    }

    /* Mostrar fotografía ampliada */

    function mostrarImagen(n) {
      if (imagenes.length === 0) return;

      indice = (n + imagenes.length) % imagenes.length;

      ampliada.src = imagenes[indice].src;
      ampliada.alt = imagenes[indice].alt;
    }

    function cerrarVisor() {
      visor.classList.remove("activo");
    }

    document.querySelector(".cerrar")
      .addEventListener("click", cerrarVisor);

    document.querySelector(".anterior")
      .addEventListener("click", () => {
        mostrarImagen(indice - 1);
      });

    document.querySelector(".siguiente")
      .addEventListener("click", () => {
        mostrarImagen(indice + 1);
      });

    visor.addEventListener("click", (evento) => {
      if (evento.target === visor) {
        cerrarVisor();
      }
    });

    document.addEventListener("keydown", (evento) => {
      if (!visor.classList.contains("activo")) return;

      if (evento.key === "Escape") {
        cerrarVisor();
      }

      if (evento.key === "ArrowLeft") {
        mostrarImagen(indice - 1);
      }

      if (evento.key === "ArrowRight") {
        mostrarImagen(indice + 1);
      }
    });

    cargarFotografias();
  </script>

</body>
</html>
